<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxian — figma-transfer hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Cockpit design tokens the game depends on */
    :root {
      --bg:        #0E141B;
      --bg-2:      #121821;
      --panel:     #141B25;
      --panel-2:   #18202B;
      --line:      rgba(216, 222, 230, 0.08);
      --line-2:    rgba(216, 222, 230, 0.14);
      --line-3:    rgba(216, 222, 230, 0.22);
      --ink:       #D8DEE6;
      --ink-2:     #B0B8C4;
      --ink-3:     #8B95A4;
      --ink-4:     #5C6573;
      --ink-5:     #3F4754;
      --muted:     #8B95A4;
      --accent:      #EA4A35;
      --accent-soft: rgba(234, 74, 53, 0.14);
      --sans: "Inter", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
    }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box; }
    main { width: 100%; max-width: 980px; }
  </style>
</head>
<body>
<main>
<!-- ============================================================
     GALAXIAN — figma-transfer hero game
     Imported from concept-v3-figma-transfer-galaxian.html.
     All styles scoped under .gx-host; class names verified
     to not collide with the rest of /cockpit.
============================================================ -->
<style>
  /* Galaxian — slim cockpit-style integration.
     Inherits cockpit's --bg / --ink / --accent / --mono / --sans tokens.
     Original game's loud chrome (HUD bar, side rail, source-panel, skip-intro,
     banners, player labels) is hidden — only the playfield + player + enemies
     remain, sitting on a flat panel with one subtle border. */
  .gx-host {
    /* Map original game vars onto cockpit's design tokens */
    --cyan: var(--accent, #EA4A35);
    --green: #6B9E80;
    --violet: #8E9BB6;
    --orange: #C9994B;
    --yellow: #C9994B;
    --red: #C97268;
    --muted: var(--ink-3, #8B95A4);
    --faint: var(--ink-4, #5C6573);
    --ease: cubic-bezier(0.2, 0.82, 0.18, 1);
    --grid: 56px;
    --player-x: 50%;
    color: inherit;
    font-family: var(--sans);
  }
  .gx-host * { box-sizing: border-box; }
  .gx-host a { color: inherit; text-decoration: none; }
  .gx-host button { font: inherit; color: inherit; }

  .gx-host.game-shell {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line, rgba(216, 222, 230, 0.08));
    border-radius: 0;
    background: linear-gradient(180deg, rgba(234, 74, 53, 0.025), transparent 60%);
    isolation: isolate;
    min-height: 460px;
  }
  .gx-host.game-shell::before {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(216, 222, 230, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(216, 222, 230, 0.04) 1px, transparent 1px);
    background-size: var(--grid) var(--grid);
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
    opacity: 0.5;
    content: "";
    pointer-events: none;
  }
  .gx-host.game-shell::after { content: none; }

  /* Slim caption — replaces the heavy HUD bar */
  .gx-caption {
    position: absolute;
    top: 16px; left: 18px;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-4, #5C6573);
    pointer-events: none;
  }
  .gx-caption b {
    color: var(--ink-2, #B0B8C4);
    font-weight: 600;
    letter-spacing: 0.16em;
  }
  .gx-caption::before {
    content: "▸";
    color: var(--accent, #EA4A35);
  }
  .gx-readout {
    position: absolute;
    top: 16px; right: 18px;
    z-index: 4;
    display: flex;
    gap: 18px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-4, #5C6573);
    pointer-events: none;
  }
  .gx-readout span b {
    margin-left: 6px;
    color: var(--accent, #EA4A35);
    font-weight: 600;
  }

  /* Hide everything noisy from the original layout */
  .gx-host .hud,
  .gx-host .side-rail,
  .gx-host .source-panel,
  .gx-host .skip-intro,
  .gx-host .floating-tip,
  .gx-host .control-line,
  .gx-host .wave-banner,
  .gx-host .finish-cta,
  .gx-host .player .player-label,
  .gx-host .player .legend { display: none !important; }

  .game-shell.is-overloaded { animation: gx-shell-shake 0.42s linear 2; }
  @keyframes gx-shell-shake {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(-5px, 1px); }
    40%  { transform: translate(6px, -2px); }
    60%  { transform: translate(-4px, 2px); }
    80%  { transform: translate(5px, -1px); }
    100% { transform: translate(0, 0); }
  }

  .gx-host .hud {
    position: relative;
    z-index: 3;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 22px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
  }
  .gx-host .hud-title {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .gx-host .hud-title strong,
  .gx-host .hud-title span,
  .gx-host .hud-stat,
  .gx-host .hud-context span,
  .gx-host .wave-banner,
  .gx-host .legend,
  .gx-host .terminal-tag,
  .gx-host .builder-tag,
  .gx-host .status-line,
  .gx-host .source-tag,
  .gx-host .source-note,
  .gx-host .floating-tip,
  .gx-host .control-line,
  .gx-host .skip-intro,
  .gx-host .cta-note,
  .gx-host .builder-item,
  .gx-host .slot-count,
  .gx-host .artifact-pill,
  .gx-host .terminal-log,
  .gx-host .terminal-line,
  .gx-host .enemy,
  .gx-host .preview-card,
  .gx-host .preview-tabs,
  .gx-host .preview-scale,
  .gx-host .preview-spacing,
  .gx-host .preview-modal {
    font-family: var(--mono);
  }
  .gx-host .hud-title strong {
    color: rgba(244, 247, 251, 0.9);
    font-size: 12px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .gx-host .hud-title span {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .gx-host .hud-stats {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    justify-content: flex-end;
  }
  .gx-host .hud-stat,
  .gx-host .hud-context {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 38px;
    padding: 0 14px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    color: rgba(244, 247, 251, 0.88);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .gx-host .hud-stat b {
    color: var(--cyan);
    font-size: 14px;
    letter-spacing: 0.08em;
  }
  .gx-host .hud-context {
    position: relative;
    min-width: 224px;
    justify-content: space-between;
    gap: 14px;
  }
  .gx-host .context-bar {
    position: relative;
    overflow: hidden;
    width: 94px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
  }
  .gx-host .context-bar span {
    position: absolute;
    inset: 0 auto 0 0;
    width: calc(var(--context, 0) * 1%);
    border-radius: inherit;
    background: linear-gradient(90deg, var(--cyan), var(--orange), var(--red));
    box-shadow: 0 0 16px rgba(248, 113, 113, 0.42);
  }
  .gx-host .context-text {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .gx-host .game-main {
    display: block;
    min-height: 460px;
  }
  .gx-host .playfield-shell {
    position: relative;
    min-width: 0;
    min-height: 460px;
    padding: 0;
  }
  .gx-host .playfield {
    position: relative;
    min-height: 460px;
    height: 100%;
    overflow: hidden;
  }
  .gx-host .track-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .gx-host .track-lines span {
    position: absolute;
    left: 6%;
    right: 6%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
  }

  .gx-host .source-panel {
    position: absolute;
    left: 26px;
    bottom: 52px;
    z-index: 2;
    width: 146px;
    display: grid;
    justify-items: center;
    gap: 16px;
    text-align: center;
  }
  .gx-host .source-card {
    position: relative;
    display: grid;
    place-items: center;
    width: 146px;
    height: 146px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 28px;
    background:
      linear-gradient(180deg, rgba(162, 89, 255, 0.07), rgba(255, 255, 255, 0.012)),
      rgba(18, 18, 22, 0.95);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 18px 42px rgba(0, 0, 0, 0.32);
    overflow: hidden;
  }
  .gx-host .source-card::after {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 35% 35%, rgba(162, 89, 255, 0.28), transparent 58%);
    opacity: 0.7;
    content: "";
  }
  .gx-host .source-tag,
  .gx-host .source-note { margin: 0; }
  .gx-host .source-tag {
    color: rgba(244, 247, 251, 0.64);
    font-size: 14px;
    letter-spacing: 0.38em;
    text-transform: uppercase;
  }
  .gx-host .source-note {
    color: rgba(244, 247, 251, 0.28);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: lowercase;
  }

  .gx-host .player {
    position: absolute;
    bottom: 28px;
    left: var(--player-x);
    z-index: 4;
    display: grid;
    justify-items: center;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .gx-host .player-core {
    position: relative;
    width: 10px;
    height: 88px;
    border-radius: 999px;
    background: linear-gradient(180deg, transparent, rgba(234, 74, 53, 0.85), transparent);
    box-shadow:
      0 0 0 1px rgba(234, 74, 53, 0.25),
      0 0 24px rgba(234, 74, 53, 0.20);
  }
  .gx-host .player-core::before {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 2px;
    border-radius: inherit;
    background: linear-gradient(180deg, transparent, #fff, var(--accent, #EA4A35), transparent);
    transform: translateX(-50%);
    content: "";
  }
  .gx-host .player-core::after {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(234, 74, 53, 0.30), transparent 68%);
    filter: blur(10px);
    content: "";
  }
  .gx-host .layer { position: absolute; inset: 0; pointer-events: none; }

  .gx-host .enemy {
    position: absolute;
    min-width: 168px;
    padding: 10px 12px 11px;
    border-radius: 6px;
    background: rgba(20, 27, 37, 0.92);
    border: 1px solid var(--line-2, rgba(216, 222, 230, 0.14));
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.32);
  }
  .gx-host .enemy::before { content: none; }
  .gx-host .enemy-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .gx-host .enemy-kind {
    color: rgba(244, 247, 251, 0.92);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .gx-host .enemy-meta {
    color: rgba(244, 247, 251, 0.34);
    font-size: 10px;
    letter-spacing: 0.12em;
  }
  .gx-host .enemy-lines { display: grid; gap: 4px; }
  .gx-host .enemy-line {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    color: rgba(244, 247, 251, 0.76);
    font-size: 10px;
    line-height: 1.35;
    white-space: nowrap;
  }
  .gx-host .enemy-line.is-noise { color: var(--warn, #C9994B); opacity: 0.85; }
  .gx-host .enemy-line.is-clean { color: var(--accent, #EA4A35); opacity: 0.85; }

  .gx-host .beam {
    position: absolute;
    pointer-events: none;
    border-radius: 999px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.95) 0%,
      rgba(234, 74, 53, 0.95) 42%,
      rgba(234, 74, 53, 0.30) 100%
    );
    box-shadow: 0 0 12px rgba(234, 74, 53, 0.45);
    transform: translate(-50%, -50%);
  }
  .gx-host .beam::before, .gx-host .beam::after { content: none; }

  .gx-host .artifact-pill {
    position: absolute;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    box-shadow: 0 0 18px rgba(234, 74, 53, 0.16);
  }
  .gx-host .particle {
    position: absolute;
    border-radius: 999px;
    transform: translate(-50%, -50%);
  }

  .gx-host .wave-banner {
    position: absolute;
    top: 30px;
    left: 50%;
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 38px;
    padding: 0 16px;
    border: 1px solid rgba(234, 74, 53, 0.18);
    border-radius: 999px;
    background: rgba(6, 10, 14, 0.76);
    color: rgba(244, 247, 251, 0.86);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    pointer-events: none;
  }
  .gx-host .wave-banner.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .gx-host .floating-tip {
    position: absolute;
    left: 28px;
    top: 24px;
    z-index: 5;
    color: rgba(244, 247, 251, 0.32);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    max-width: 210px;
    line-height: 1.5;
    pointer-events: none;
  }
  .gx-host .control-line {
    position: absolute;
    right: 24px;
    bottom: 24px;
    z-index: 5;
    color: rgba(244, 247, 251, 0.32);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: right;
    pointer-events: none;
  }
  .gx-host .skip-intro {
    position: absolute;
    right: 20px; top: 20px;
    z-index: 6;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    padding: 0 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 180ms var(--ease), border-color 180ms var(--ease), transform 180ms var(--ease);
  }
  .gx-host .skip-intro:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(234, 74, 53, 0.24);
    transform: translateY(-1px);
  }

  .gx-host .finish-cta {
    position: absolute;
    inset: auto 24px 24px auto;
    z-index: 7;
    display: grid;
    gap: 10px;
    justify-items: end;
    text-align: right;
    opacity: 0;
    pointer-events: none;
    transform: translateY(16px);
    transition: opacity 260ms var(--ease), transform 260ms var(--ease);
  }
  .gx-host .finish-cta.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .gx-host .finish-cta a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(234, 74, 53, 0.18), rgba(134, 239, 172, 0.14));
    border: 1px solid rgba(234, 74, 53, 0.28);
    color: rgba(244, 247, 251, 0.94);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
  }
  .gx-host .cta-note {
    color: rgba(244, 247, 251, 0.42);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .gx-host .side-rail {
    position: relative;
    display: grid;
    gap: 14px;
    padding: 20px 18px 18px 0;
    border-left: 1px solid rgba(255, 255, 255, 0.05);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.012));
  }
  .gx-host .panel {
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 26px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)),
      rgba(8, 10, 14, 0.9);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.06),
      0 16px 48px rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(14px);
  }
  .gx-host .builder-panel { min-height: 382px; padding: 18px 18px 16px; }
  .gx-host .terminal-panel { min-height: 238px; padding: 16px 16px 14px; }
  .gx-host .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .gx-host .builder-tag,
  .gx-host .terminal-tag {
    color: rgba(244, 247, 251, 0.72);
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }
  .gx-host .panel-meta {
    color: rgba(244, 247, 251, 0.28);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .gx-host .slot-card {
    display: grid;
    gap: 14px;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.028);
  }
  .gx-host .slot-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .gx-host .slot-title {
    color: rgba(244, 247, 251, 0.96);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .gx-host .slot-count {
    color: rgba(234, 74, 53, 0.8);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .gx-host .builder-list { display: grid; gap: 10px; }
  .gx-host .builder-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(244, 247, 251, 0.62);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: none;
  }
  .gx-host .builder-item::before {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.03);
    color: rgba(255, 255, 255, 0.28);
    font-size: 10px;
    content: "·";
    flex: none;
  }
  .gx-host .builder-item.is-done { color: rgba(244, 247, 251, 0.92); }
  .gx-host .builder-item.is-done::before {
    border-color: rgba(134, 239, 172, 0.36);
    background: rgba(134, 239, 172, 0.12);
    color: rgba(134, 239, 172, 0.94);
    content: "✓";
  }
  .gx-host .builder-empty {
    color: rgba(244, 247, 251, 0.38);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .gx-host .built-stack { display: grid; gap: 12px; margin-top: 14px; }
  .gx-host .built-card {
    display: grid;
    gap: 12px;
    padding: 14px;
    border: 1px solid rgba(134, 239, 172, 0.18);
    border-radius: 18px;

    function clamp(v, mn, mx) { return Math.min(mx, Math.max(mn, v)); }

      return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }
    function getNow() { return performance.now(); }

    function gameInView() {
      const r = shell.getBoundingClientRect();
      return r.bottom > 60 && r.top < window.innerHeight - 60;
    }

    function resize() {
      const rect = playfield.getBoundingClientRect();
      state.width = rect.width;
      state.height = rect.height;
      if (!state.playerX) state.playerX = rect.width * 0.5;
      else state.playerX = clamp(state.playerX, 56, rect.width - 56);
      render();
    }
    function pushLog(message, type = "info") {
      state.logs.unshift({ message, type });
      state.logs = state.logs.slice(0, 6);
    }
    function colorForIndex(i) { return CLEAN_COLORS[i % CLEAN_COLORS.length]; }

    function createEnemy(kind) {
      const t = catalog[kind];
      const id = state.nextId++;
      const laneCount = Math.max(4, Math.min(6, Math.floor(state.width / 130)));
      const lane = id % laneCount;
      const x = ((lane + 0.65) / laneCount) * state.width;
      const xOffset = ((id * 37) % 40) - 20;
      return {
        id, kind,
        x: clamp(x + xOffset, 120, state.width - 120),
        y: -t.size.h * 0.55,
        drift: ((id % 5) - 2) * 10,
        hp: t.hp, hpMax: t.hp,
        speed: t.speed, size: t.size,
        lines: t.lines.map((l) => ({ ...l })),
        payload: t.payload.map((label, i) => ({ label, color: colorForIndex(i), blockKind: kind })),
        flashUntil: 0
      };
    }

    function spawnWaveBanner(text) {
      state.bannerText = text;
      state.waveShownAt = getNow();
      waveBanner.textContent = text;
      waveBanner.classList.add("is-visible");
    }

    function spawnWaveIfNeeded(now) {
      if (state.status !== "playing" || state.waveIndex >= waves.length) return;
      const wave = waves[state.waveIndex];
      if (state.spawnedInWave < wave.kinds.length && now >= state.nextSpawnAt) {
        const kind = wave.kinds[state.spawnedInWave];
        state.enemies.push(createEnemy(kind));
        state.spawnedInWave += 1;
        state.nextSpawnAt = now + wave.interval;
        state.prompt = `sanitizing ${kind} payload`;
        pushLog(`spawn> ${kind} payload detected`);
      }
      if (state.spawnedInWave >= wave.kinds.length && state.enemies.length === 0 && state.artifacts.length === 0) {
        if (!state.clearAt) state.clearAt = now;
        if (now - state.clearAt > 1250) {
          state.waveIndex += 1;
          state.spawnedInWave = 0;
          state.clearAt = null;
          if (state.waveIndex < waves.length) {
            const next = waves[state.waveIndex];
            state.nextSpawnAt = now + 900;
            spawnWaveBanner(next.label);
          } else if (!state.endedAt) {
            finishGame(now);
          }
        }
      } else {
        state.clearAt = null;
      }
    }

    function finishGame(now) {
      state.status = "ended";
      state.endedAt = now;
      state.beams = []; state.enemies = []; state.artifacts = []; state.particles = [];
      state.prompt = "clean payload routed downstream";
      terminalStatus.textContent = "hero complete";
      finishCta.classList.add("is-visible");
      spawnWaveBanner("Hero complete / continue ↓");
    }

    function createBeam() {
      const now = getNow();
      const cooldown = Math.max(90, 240 - state.builtBlocks.length * 18);
      if (state.overloadUntil > now || now - state.lastShotAt < cooldown) return;
      state.lastShotAt = now;
      const empowered = state.builtBlocks.length >= 3;
      state.beams.push({
        id: state.nextId++,
        x: state.playerX,
        y: state.height - 146,
        speed: empowered ? 1080 : 960,
        width: empowered ? 14 : 10,
        length: empowered ? 34 : 26
      });
    }

    function spawnParticles({ x, y, color, count, intense }) {
      for (let i = 0; i < count; i++) {
        state.particles.push({
          id: state.nextId++,
          x, y,
          vx: (Math.random() - 0.5) * (intense ? 240 : 130),
          vy: Math.random() * (intense ? 220 : 130) + (intense ? 40 : 20),
          ttl: intense ? 1.2 : 0.8,
          color,
          size: Math.random() * (intense ? 3.4 : 2.2) + 1,
          glow: intense
        });
      }
    }

    function hitEnemy(enemy, beam) {
      enemy.hp -= 1;
      enemy.flashUntil = getNow() + 120;
      const noiseIndex = enemy.lines.findIndex((l) => l.tone === "noise");
      if (noiseIndex !== -1) enemy.lines.splice(noiseIndex, 1);
      else if (enemy.lines.length > 4) enemy.lines.splice(1, 1);

      spawnParticles({
        x: beam.x,
        y: Math.max(enemy.y, 60),
        color: NOISE_COLORS[(enemy.hpMax - enemy.hp) % NOISE_COLORS.length],
        count: enemy.hp <= 0 ? 24 : 11,
        intense: enemy.hp <= 0
      });

      if (enemy.hp <= 0) destroyEnemy(enemy);
      else pushLog(`strip> ${enemy.kind} lost one noisy layer`);
    }

    function destroyEnemy(enemy) {
      state.score += 100;
      state.prompt = `${enemy.kind} normalized`;
      pushLog(`normalize> ${enemy.kind} emitted ${enemy.payload.length} artifacts`);
      enemy.payload.forEach((artifact, i) => {
        state.artifacts.push({
          id: state.nextId++,
          blockKind: artifact.blockKind,
          label: artifact.label,
          color: artifact.color,
          x: enemy.x + (Math.random() - 0.5) * 36,
          y: enemy.y,
          vx: (Math.random() - 0.5) * 120 + (i - enemy.payload.length / 2) * 18,
          vy: -140 - Math.random() * 90,
          ttl: 2.9
        });
      });
      state.enemies = state.enemies.filter((e) => e.id !== enemy.id);
    }

    function handleEnemyLeak(enemy) {
      state.enemies = state.enemies.filter((e) => e.id !== enemy.id);
      state.contextPct = clamp(state.contextPct + 15, 0, 100);
      state.prompt = "warning: noisy payload breached sink";
      state.received += 1;
      pushLog(`leak> ${enemy.kind} hit terminal`, "error");
      spawnParticles({
        x: clamp(state.width - 26, 0, state.width),
        y: state.height * 0.72,
        color: "#f87171",
        count: 18,
        intense: true
      });
      if (state.contextPct >= 100) triggerOverload();
    }

    function triggerOverload() {
      const now = getNow();
      state.contextPct = 100;
      state.overloadUntil = now + 3000;
      state.overloadPulseUntil = now + 900;
      state.artifacts = [];
      state.prompt = "Error: token budget exceeded";
      pushLog("fail> token budget exceeded", "error");
      shell.classList.add("is-overloaded");
      terminalPanel.classList.add("is-overloaded");
      window.setTimeout(() => shell.classList.remove("is-overloaded"), 840);
    }

    function releaseOverload(now) {
      if (state.overloadUntil && now >= state.overloadUntil) {
        state.overloadUntil = 0;
        state.contextPct = 30;
        state.prompt = "recovered, resume sanitize loop";
        pushLog("recover> context cache flushed");
        terminalPanel.classList.remove("is-overloaded");
      }
    }

    function getSlotProgress(kind) {
      if (!state.progress[kind]) {
        state.progress[kind] = { required: catalog[kind].payload.slice(), collected: [] };
      }
      return state.progress[kind];
    }

    function collectArtifact(artifact) {
      const progress = getSlotProgress(artifact.blockKind);
      state.activeKind = artifact.blockKind;
      state.prompt = `builder routing ${artifact.blockKind}`;
      if (!progress.collected.includes(artifact.label)) progress.collected.push(artifact.label);
      state.received += 1;
      state.score += 24;
      pushLog(`pickup> ${artifact.label}`);
      if (progress.collected.length >= progress.required.length) completeBlock(artifact.blockKind);
    }

    function completeBlock(kind) {
      const progress = getSlotProgress(kind);
      state.builtBlocks.unshift({ id: state.nextId++, kind, data: progress.collected.slice() });
      state.builtBlocks = state.builtBlocks.slice(0, 6);
      delete state.progress[kind];
      state.activeKind = null;
      state.score += 250;
      state.prompt = `${kind} block ready`;
      pushLog(`build> ${kind} block assembled`);
    }

    function choosePreviewKind() {
      if (state.activeKind) return state.activeKind;
      const active = Object.keys(state.progress).find(
        (k) => state.progress[k].collected.length < state.progress[k].required.length
      );
      if (active) return active;
      if (state.waveIndex < waves.length) {
        const w = waves[state.waveIndex];
        return w.kinds[state.spawnedInWave] || w.kinds[w.kinds.length - 1];
      }
      return "Button";
    }

    function renderSlot() {
      const kind = choosePreviewKind();
      const progress = getSlotProgress(kind);
      const collectedSet = new Set(progress.collected);
      const completed = collectedSet.size;
      builderMeta.textContent = completed ? `collecting ${kind}` : "awaiting artifacts";
      const items = progress.required.map((item) => {
        const done = collectedSet.has(item);
        return `<div class="builder-item ${done ? "is-done" : ""}">${escapeHtml(item)}</div>`;
      }).join("");
      activeSlot.innerHTML = `
        <div class="slot-card">
          <div class="slot-head">
            <div class="slot-title">${escapeHtml(kind)}</div>
            <div class="slot-count">${completed} / ${progress.required.length}</div>
          </div>
          <div class="builder-list">${items}</div>
        </div>
      `;
    }

    function previewMarkup(kind) {
      switch (kind) {
        case "Button":   return `<div class="preview-card"><div class="preview-button">Continue</div></div>`;
        case "Card":     return `<div class="preview-card"><div class="preview-card-shell"><h4>Header</h4><p>Body slot resolved from clean structure.</p><footer><span>Footer</span><span>Action</span></footer></div></div>`;
        case "Input":    return `<div class="preview-card"><input class="preview-input" value="" placeholder="Email"></div>`;
        case "Tabs":     return `<div class="preview-card"><div class="preview-tabs"><span>Overview</span><span>Activity</span><span>Settings</span></div></div>`;
        case "Avatar":   return `<div class="preview-card"><div class="preview-avatar">EK</div></div>`;
        case "Typography":return`<div class="preview-card"><div class="preview-scale"><span>Aa</span><span>Aa</span><span>Aa</span><span>Aa</span></div></div>`;
        case "Spacing":  return `<div class="preview-card"><div class="preview-spacing"><span></span><span></span><span></span><span></span><span></span></div></div>`;
        case "Modal":    return `<div class="preview-card"><div class="preview-modal"><header><span>Confirm action</span><span>×</span></header><p>Header, body, footer, and actions have all been normalized.</p><footer><button>Cancel</button><button>Confirm</button></footer></div></div>`;
        default: return "";
      }
    }

    function renderBuiltBlocks() {
      builtStack.innerHTML = state.builtBlocks.map((b) => `
        <div class="built-card">
          <div class="built-head"><span>${escapeHtml(b.kind)}</span></div>
          ${previewMarkup(b.kind)}
        </div>
      `).join("");
    }

    function renderEnemies(now) {
      enemyLayer.innerHTML = state.enemies.map((enemy) => {
        const freshness = enemy.hp / enemy.hpMax;
        const borderMix = 0.65 + freshness * 0.35;
        const shadow = enemy.flashUntil > now ? "0 0 26px rgba(255,255,255,0.35)" : `0 0 24px rgba(251, 146, 60, ${0.1 + freshness * 0.16})`;
        const lines = enemy.lines.map(
          (line) => `<span class="enemy-line ${line.tone === "noise" ? "is-noise" : line.tone === "clean" ? "is-clean" : ""}">${escapeHtml(line.text)}</span>`
        ).join("");
        return `
          <div class="enemy" style="left:${enemy.x}px;top:${enemy.y}px;width:${enemy.size.w}px;box-shadow:${shadow};opacity:${enemy.hp <= 0 ? 0 : 1};--border-mix:${borderMix};">
            <div class="enemy-head"><span class="enemy-kind">${escapeHtml(enemy.kind)}</span><span class="enemy-meta">hp ${enemy.hp} / ${enemy.hpMax}</span></div>
            <div class="enemy-lines">${lines}</div>
          </div>
        `;
      }).join("");
    }
    function renderBeams() {
      beamLayer.innerHTML = state.beams.map((b) => `
        <div class="beam" style="left:${b.x}px;height:${b.length}px;width:${b.width}px;top:${b.y}px;"></div>
      `).join("");
    }
    function renderArtifacts() {
      artifactLayer.innerHTML = state.artifacts.map((a) => `
        <div class="artifact-pill" style="left:${a.x}px;top:${a.y}px;color:${a.color};background:${a.color}1a;border:1px solid ${a.color}72;box-shadow:0 0 18px -3px ${a.color}99;">${escapeHtml(a.label)}</div>
      `).join("");
    }
    function renderParticles() {
      particleLayer.innerHTML = state.particles.map((p) => `
        <span class="particle" style="left:${p.x}px;top:${p.y}px;width:${p.size}px;height:${p.size}px;background:${p.color};box-shadow:${p.glow ? `0 0 8px ${p.color}` : "none"};opacity:${clamp(p.ttl / (p.glow ? 1.2 : 0.8), 0, 1)};"></span>
      `).join("");
    }
    function renderTerminal() {
      const overload = state.overloadUntil > getNow();
      terminalPrompt.textContent = state.prompt;
      terminalReceived.textContent = `received: ${state.received}`;
      terminalOverload.textContent = overload ? "throttled" : "stable";
      terminalContextBar.parentElement.style.setProperty("--context", state.contextPct);
      terminalContextBar.style.width = `${state.contextPct}%`;
      terminalStatus.textContent = overload ? "context overflow" : state.status === "ended" ? "hero complete" : "implementation sink";
      terminalLogs.innerHTML = state.logs.map(
        (e) => `<div class="terminal-log ${e.type === "error" ? "is-error" : ""}">${escapeHtml(e.message)}</div>`
      ).join("");
    }
    function renderHud() {
      scoreValue.textContent = String(state.score).padStart(4, "0");
      blocksValue.textContent = `${state.builtBlocks.length} / ${GOAL_BLOCKS}`;
      waveValue.textContent = `${Math.min(state.waveIndex + 1, waves.length)} / ${waves.length}`;
      contextValue.textContent = `${Math.round(state.contextPct)}%`;
      contextBar.parentElement.style.setProperty("--context", state.contextPct);
      contextBar.style.width = `${state.contextPct}%`;
    }
    function render() {
      playerEl.style.setProperty("--player-x", `${state.playerX}px`);
      renderHud();
      renderSlot();
      renderBuiltBlocks();
      renderEnemies(getNow());
      renderBeams();
      renderArtifacts();
      renderParticles();
      renderTerminal();
      const bannerVisible = getNow() - state.waveShownAt < 2200;
      waveBanner.textContent = state.bannerText;
      waveBanner.classList.toggle("is-visible", bannerVisible);
      finishCta.classList.toggle("is-visible", state.status === "ended");
    }

    function handleInput(dt, now) {
      const speed = 420;
      let velocity = 0;
      if (state.movingLeft)  velocity -= 1;
      if (state.movingRight) velocity += 1;
      if (state.pointerX != null) {
        const delta = state.pointerX - state.playerX;
        state.playerX += delta * Math.min(1, dt * 12);
      }
      state.playerX = clamp(state.playerX + velocity * speed * dt, 56, state.width - 56);
      if ((state.shooting || state.pointerDown) && state.status === "playing") createBeam();
      if (now > state.waveShownAt + 2200 && waveBanner.classList.contains("is-visible")) {
        waveBanner.classList.remove("is-visible");
      }
    }

    function updateBeams(dt) {
      state.beams.forEach((b) => { b.y -= b.speed * dt; });
      state.beams = state.beams.filter((b) => b.y > -b.length);
    }
    function updateEnemies(dt) {
      state.enemies.forEach((enemy) => {
        enemy.y += enemy.speed * dt;
        enemy.x += Math.sin((enemy.y + enemy.id * 17) / 90) * enemy.drift * dt;
        enemy.x = clamp(enemy.x, enemy.size.w * 0.4, state.width - enemy.size.w * 0.4);
      });
    }
    function updateArtifacts(dt) {
      const playerY = state.height - 96;
      const pickupRadius = state.builtBlocks.length >= 3 ? 78 : 62;
      state.artifacts.forEach((a) => { a.vy += 260 * dt; a.x += a.vx * dt; a.y += a.vy * dt; a.ttl -= dt; });
      state.artifacts = state.artifacts.filter((a) => {
        if (a.ttl <= 0 || a.y > state.height + 40) return false;
        if (a.vy > 0 && a.y >= playerY && Math.abs(a.x - state.playerX) <= pickupRadius) {
          collectArtifact(a);
          spawnParticles({ x: a.x, y: a.y, color: a.color, count: 10, intense: false });
          return false;
        }
        return true;
      });
    }
    function updateParticles(dt) {
      state.particles.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 180 * dt; p.ttl -= dt; });
      state.particles = state.particles.filter((p) => p.ttl > 0);
    }
    function processCollisions() {
      const consumed = new Set();
      state.beams.forEach((beam) => {
        const hit = state.enemies.find((e) => {
          const wx = Math.abs(beam.x - e.x) <= e.size.w * 0.46 + beam.width * 0.5;
          const wy = Math.abs(beam.y - e.y) <= e.size.h * 0.5 + beam.length * 0.5;
          return wx && wy;
        });
        if (hit) { consumed.add(beam.id); hitEnemy(hit, beam); }
      });
      state.beams = state.beams.filter((b) => !consumed.has(b.id));
      state.enemies.filter((e) => e.y - e.size.h * 0.5 > state.height - 28).forEach((e) => handleEnemyLeak(e));
    }

    function seedStaticPreview() {
      state.builtBlocks = [
        { id: state.nextId++, kind: "Card",   data: [] },
        { id: state.nextId++, kind: "Button", data: [] },
        { id: state.nextId++, kind: "Input",  data: [] }
      ];
      state.progress = { Tabs: { required: catalog.Tabs.payload.slice(), collected: catalog.Tabs.payload.slice(0, 3) } };
      state.activeKind = "Tabs";
      state.enemies = [createEnemy("Modal")];
      state.enemies[0].x = state.width * 0.58;
      state.enemies[0].y = state.height * 0.25;
      state.enemies[0].speed = 0;
      state.beams = [];
      state.artifacts = [{
        id: state.nextId++, blockKind: "Tabs",
        label: "--color-accent", color: "#EA4A35",
        x: state.width * 0.64, y: state.height * 0.42,
        vx: 0, vy: 0, ttl: 999
      }];
      state.bannerText = "Reduced motion / static preview";
      state.waveShownAt = getNow();
      finishCta.classList.add("is-visible");
    }

    let lastTime = getNow();
    let frame = 0;
    function tick(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.032);
      lastTime = now;
      if (!reducedMotion) {
        handleInput(dt, now);
        releaseOverload(now);
        if (state.status === "playing") {
          spawnWaveIfNeeded(now);
          updateBeams(dt);
          updateEnemies(dt);
          updateArtifacts(dt);
          updateParticles(dt);
          processCollisions();
          if (state.builtBlocks.length >= GOAL_BLOCKS && state.waveIndex >= waves.length - 1 && !state.endedAt) {
            finishGame(now);
          }
        }
      }
      render();
      frame = requestAnimationFrame(tick);
    }

    function setPointerPosition(event) {
      const rect = playfield.getBoundingClientRect();
      state.pointerX = clamp(event.clientX - rect.left, 56, rect.width - 56);
    }

    function onKeyDown(event) {
      // Only intercept keys when the game is in view — otherwise the user is
      // reading the rest of /cockpit and shouldn't have Space/Arrows hijacked.
      if (!gameInView()) return;
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") state.movingLeft = true;
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") state.movingRight = true;
      if (event.key === " " || event.code === "Space") {
        event.preventDefault();
        state.shooting = true;
        if (state.status === "ended") {
          const target = document.getElementById("designer");
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    }
    function onKeyUp(event) {
      if (event.key === "ArrowLeft"  || event.key.toLowerCase() === "a") state.movingLeft = false;
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") state.movingRight = false;
      if (event.key === " " || event.code === "Space") state.shooting = false;
    }

    playfield.addEventListener("pointermove", (e) => setPointerPosition(e));
    playfield.addEventListener("pointerdown", (e) => { setPointerPosition(e); state.pointerDown = true; });
    window.addEventListener("pointerup", () => { state.pointerDown = false; });
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    window.addEventListener("resize", resize, { passive: true });

    skipIntro.addEventListener("click", () => {
      finishGame(getNow());
      const target = document.getElementById("designer");
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    resize();
    if (reducedMotion) { seedStaticPreview(); render(); }
    spawnWaveBanner(state.bannerText);
    frame = requestAnimationFrame(tick);

    window.addEventListener("beforeunload", () => { cancelAnimationFrame(frame); });
  })();
</script>
</main>
</body>
</html>
